<main class="w-screen h-screen flex flex-col md:flex-row overflow-hidden">
    <arcgis-map 
        basemap="topo-vector" 
        center="100.78547918479006,12.920549311286171" 
        zoom="20" 
        (arcgisViewReadyChange)="arcgisViewReadyChange($event)" 
        class="flex-1 h-full min-h-[50vh] relative">
         <arcgis-sketch
            slot="bottom-right"
            view="Map"
            creation-mode="continuous"
            layout="horizontal"
        (arcgisViewReadyChange)="sketchEvent($event)"></arcgis-sketch>
    </arcgis-map>

    <section class="w-full md:w-[350px] h-full bg-white shadow-lg p-4 overflow-y-auto flex-shrink-0 z-10">
        
    </section>
</main>
